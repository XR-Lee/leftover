name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The suites are pure mock: no network, no vendor CLI, no subscription spend.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Compile
        run: python -m compileall -q leftover tests
      - name: Product contract
        run: python tests/test_macbot.py
      - name: Routing, probes, classification
        run: python tests/test_routing.py
      - name: Group modes end to end
        run: python tests/test_e2e.py
      - name: Reliability
        run: python tests/test_reliability.py
      - name: State reliability
        run: python tests/test_state_reliability.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check leftover tests
