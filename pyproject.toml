[project]
name = "leftover"
version = "0.1.0"
description = "Spend leftover coding-CLI quota before the window resets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Xinrun Li" }]
keywords = [
    "cli", "codex", "claude-code", "cursor", "grok",
    "acp", "agent", "quota", "router",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "agent-client-protocol>=0.12",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Frozen Telegram transport (`agora bot`). The router itself does not need it.
telegram = ["python-telegram-bot>=21.0"]
dev = ["ruff>=0.12"]

[project.urls]
Homepage = "https://github.com/XR-Lee/leftover"
Repository = "https://github.com/XR-Lee/leftover"
Issues = "https://github.com/XR-Lee/leftover/issues"

[project.scripts]
leftover = "leftover.macbot:main"
macbot = "leftover.macbot:main"
agora = "leftover.agora_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["leftover", "leftover.agents", "leftover.transports"]

[tool.setuptools.package-data]
leftover = ["skills/*/SKILL.md"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# Pinned so a newer ruff in CI cannot fail a build that passes locally.
# Blind excepts are deliberate here (cleanup paths that must not mask an
# answer) and are annotated with `# noqa: BLE001` rather than selected for.
select = ["E4", "E7", "E9", "F", "W"]
